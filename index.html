<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe600">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SISTEMAS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>SISTEMAS</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --lime: #ffe600;
      --lime-strong: #d6b900;
      --pink: #ff4fa3;
      --green: #22a447;
      --blue: #1266d6;
      --violet: #7c3aed;
      --red: #d92d20;
      --ink: #10140d;
      --muted: #5b6252;
      --paper: #fbfff0;
      --panel: #fff7a8;
      --line: #f0cc00;
      --white: #ffffff;
      --shadow: 0 18px 45px rgba(70, 110, 0, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 230, 0, .55), transparent 34rem),
        linear-gradient(135deg, #fff8b8 0%, #ffffff 48%, #fff27a 100%);
    }

    button, input, textarea { font: inherit; }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--lime);
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(1.65rem, 3vw, 2.4rem);
      letter-spacing: 0;
    }

    h2 { margin-bottom: 12px; }

    .subhead {
      margin: 0;
      color: var(--muted);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .panel {
      background: rgba(251, 255, 240, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 18px;
    }

    .toolbar, .button-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar {
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .btn {
      border: 1px solid var(--lime-strong);
      border-radius: 8px;
      padding: 10px 14px;
      min-height: 42px;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover { filter: brightness(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.lime { background: var(--lime); }
    .btn.pink { background: var(--pink); border-color: #d93686; color: #fff; }
    .btn.green { background: var(--green); border-color: #15803d; color: #fff; }
    .btn.blue { background: var(--blue); border-color: #0b56b4; color: #fff; }
    .btn.violet { background: var(--violet); border-color: #5b21b6; color: #fff; }
    .btn.red { background: var(--red); border-color: #b42318; color: #fff; }

    .report-number {
      font-size: 1.08rem;
      background: var(--lime);
      border: 1px solid var(--lime-strong);
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      padding: 11px 12px;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
    }

    textarea.voice-state {
      background: #fff4b8;
      border-color: #f2d46b;
    }

    .field { margin-bottom: 16px; }

    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .listing-launch {
      margin: 0 0 16px;
    }

    .systems {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .systems .btn {
      min-height: 70px;
      white-space: normal;
    }

    .systems .btn.system-monoxide {
      grid-column: 5;
    }

    .prepared-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .prepared-item {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .76);
      padding: 10px 12px;
    }

    .prepared-item strong {
      display: block;
    }

    .prepared-meta {
      color: var(--muted);
      overflow-wrap: anywhere;
      margin-top: 3px;
    }

    .short-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .saved-list {
      display: grid;
      gap: 10px;
    }

    .saved-item {
      display: grid;
      grid-template-columns: minmax(130px, .3fr) minmax(190px, .55fr) auto;
      gap: 10px;
      align-items: center;
      border: 2px solid var(--lime-strong);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .saved-item:hover,
    .saved-item:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(80, 70, 0, .16);
      outline: 3px solid rgba(255, 230, 0, .45);
      outline-offset: 2px;
    }

    .saved-title {
      font-weight: 700;
    }

    .saved-revision {
      font-weight: 700;
      color: var(--ink);
    }

    .saved-meta {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .saved-header {
      grid-column: 1 / -1;
      padding-top: 10px;
      border-top: 1px solid var(--lime-strong);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .report-actions {
      margin: 14px 0 18px;
    }

    .report-notes {
      min-height: 180px;
    }

    .delete-report-wide {
      width: 100%;
      min-height: 96px;
      margin-top: 28px;
      background: var(--lime);
      border-color: var(--lime-strong);
      color: var(--red);
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 900;
      line-height: 1;
    }

    .listing-list {
      display: grid;
      gap: 10px;
      overflow-x: auto;
    }

    .listing-table {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, .76);
      min-width: 920px;
    }

    .listing-header,
    .listing-card {
      display: grid;
      grid-template-columns: minmax(28px, .5fr) minmax(34px, .33fr) minmax(120px, 1.5fr) minmax(78px, 1fr) minmax(160px, 2fr) minmax(90px, 1fr);
      gap: 6px;
      align-items: center;
      padding: 8px;
      font-size: .82rem;
    }

    .listing-header {
      background: var(--panel);
      font-weight: 700;
      border-bottom: 1px solid var(--line);
    }

    .listing-card {
      border-bottom: 1px solid var(--line);
    }

    .listing-card:last-child {
      border-bottom: 0;
    }

    .listing-card.visto {
      background: #ecffd3;
    }

    .listing-card .field {
      margin: 0;
    }

    .listing-card label {
      display: none;
    }

    .listing-card input[type="text"] {
      min-height: 32px;
      padding: 7px 7px;
      font-size: .82rem;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .listing-card .field-num input {
      text-align: center;
      padding-left: 3px;
      padding-right: 3px;
    }

    .listing-card .btn {
      width: 100%;
      min-height: 32px;
      padding: 6px 4px;
      font-size: .78rem;
    }

    .section-block {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .7);
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-title {
      font-weight: 700;
      font-size: 1.08rem;
    }

    .two-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .photo-slot {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 10px;
      min-width: 0;
    }

    .photo-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 6px;
      border: 1px dashed var(--line);
      background: var(--panel);
      display: grid;
      place-items: center;
      color: var(--muted);
      overflow: hidden;
      margin-bottom: 8px;
      font-size: .9rem;
      text-align: center;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-inputs {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .photo-inputs label {
      margin: 0;
      font-size: .9rem;
    }

    .photo-slot input { width: 100%; }
    .photo-slot .btn { width: 100%; }

    .preview-shell {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      overflow: auto;
      max-height: 70vh;
    }

    .doc {
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      line-height: 1.45;
    }

    .doc .doc-main-title {
      text-align: center;
      text-transform: uppercase;
      font-size: 14pt;
      font-weight: 700;
      margin: 0 0 18px;
    }

    .doc .doc-system-title {
      text-align: center;
      font-size: 13pt;
      font-weight: 700;
      margin: 0 0 16px;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .doc .doc-revision-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 12px;
      font-size: 11pt;
    }

    .doc .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 18px;
      font-size: 11pt;
    }

    .doc .summary-table th,
    .doc .summary-table td {
      border: 1px solid #222;
      padding: 4px 6px;
      vertical-align: middle;
    }

    .doc .summary-client {
      background: #d4c4f0;
      text-align: left;
      font-weight: 700;
    }

    .doc .summary-head {
      background: #ae93e4;
      text-align: center;
      font-weight: 700;
    }

    .doc .summary-table td {
      background: #e5dcf5;
    }

    .doc h3 {
      font-size: 11.5pt;
      margin: 14px 0 6px;
    }

    .doc p { margin: 0 0 8px; }

    .doc .doc-part,
    .doc .doc-section,
    .doc .photo-page,
    .doc .photo-card,
    .doc .summary-table {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .doc .photo-title {
      text-align: center;
      text-transform: uppercase;
      font-size: 14pt;
      font-weight: 700;
      margin: 22px 0 14px;
    }

    .doc .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .doc .photo-page {
      margin-bottom: 18px;
    }

    .doc .photo-page + .photo-page {
      break-before: page;
      page-break-before: always;
    }

    .doc .photo-card {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .doc .photo-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border: 1px solid #ddd;
      display: block;
    }

    .doc .blank-page {
      min-height: 1122px;
      page-break-before: always;
      page-break-after: always;
      break-before: page;
      break-after: page;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      background: rgba(255, 255, 255, .62);
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-weight: 700;
      margin-top: 10px;
    }

    .status.error { color: var(--red); }

    @media (max-width: 980px) {
      .systems, .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .systems .btn.system-monoxide { grid-column: auto; }
      .saved-item { grid-template-columns: 1fr; }
      .two-fields, .short-fields, .meta-grid { grid-template-columns: 1fr; }
      .prepared-item { grid-template-columns: 1fr; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 560px) {
      .systems, .photos { grid-template-columns: 1fr; }
      .systems .btn.system-monoxide { grid-column: auto; }
      .button-row .btn { flex: 1 1 180px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">SI</div>
        <div>
          <div class="brand-title-row">
            <h1>SISTEMAS</h1>
            <button id="installAppBtn" class="btn green install-btn" type="button" hidden>Instalar app</button>
            <button id="clearAppDataBtn" class="btn red" type="button">Limpiar datos</button>
          </div>
          <p class="subhead">Creación y archivo de informes técnicos por sistema.</p>
        </div>
      </div>
    </div>

    <section id="homeScreen" class="screen active" aria-labelledby="homeTitle">
      <div class="panel">
        <div class="toolbar">
          <h2 id="homeTitle">Informes grabados</h2>
          <button id="newReportBtn" class="btn pink" type="button">Crear nuevo informe</button>
        </div>
        <div id="savedReports" class="saved-list"></div>
      </div>
    </section>

    <section id="newReportScreen" class="screen" aria-labelledby="newReportTitle">
      <div class="panel">
        <div class="toolbar">
          <h2 id="newReportTitle">Nuevo informe</h2>
          <button id="backFromNewReportBtn" class="btn" type="button">Volver</button>
        </div>
        <div class="toolbar">
          <div class="button-row">
            <div id="currentReportNumber" class="report-number">Informe 1</div>
            <button id="saveCurrentBtn" class="btn pink" type="button">Grabar</button>
            <button id="viewAllBtn" class="btn violet" type="button">Ver conjunto</button>
          </div>
          <div class="button-row">
            <button id="downloadAllPdfBtn" class="btn green" type="button">Descargar todo en PDF</button>
            <button id="downloadAllWordBtn" class="btn blue" type="button">Descargar todo en Word</button>
            <button id="deleteCurrentBtn" class="btn red" type="button">Borrar informe actual</button>
          </div>
        </div>

        <div class="field">
          <label for="reportHeader">Cabecera del informe</label>
          <input id="reportHeader" type="text" placeholder="Ejemplo: BAE 06 - RESIDENCIA INFANTE DON JUAN">
        </div>

        <div class="short-fields">
          <div class="field">
            <label for="revisionNumber">Nº revisión</label>
            <input id="revisionNumber" type="text" value="1 RT-2026">
          </div>
          <div class="field">
            <label for="revisionText">Revisión</label>
            <input id="revisionText" type="text" value="TRIMESTRAL">
          </div>
        </div>

        <div class="button-row listing-launch">
          <button id="openListingBtn" class="btn pink" type="button">LISTADO</button>
        </div>

        <h2>Sistemas</h2>
        <div id="systemButtons" class="systems"></div>
        <div id="preparedEntries" class="prepared-list"></div>
        <div id="homeStatus" class="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="listingScreen" class="screen" aria-labelledby="listingTitle">
      <div class="panel">
        <div class="toolbar">
          <div>
            <h2 id="listingTitle">LISTADO</h2>
            <p id="listingSubtitle" class="subhead">Sin Excel cargado.</p>
          </div>
          <button id="backFromListingBtn" class="btn" type="button">Volver</button>
        </div>

        <div class="button-row" style="margin-bottom: 14px;">
          <label class="btn pink" for="listingFileInput">Cargar Excel</label>
          <input id="listingFileInput" class="hidden-input" type="file" accept=".xlsx,.xls,.csv">
          <button id="addListingRowBtn" class="btn pink" type="button">Añadir campo</button>
          <button id="downloadListingBtn" class="btn green" type="button">Descargar Excel</button>
          <button id="deleteListingBtn" class="btn red" type="button">Eliminar listado</button>
        </div>

        <div id="listingStatus" class="status" aria-live="polite"></div>
        <div id="listingRows" class="listing-list"></div>
      </div>
    </section>

    <section id="reportScreen" class="screen" aria-labelledby="reportDetailTitle">
      <div class="panel">
        <div class="toolbar">
          <div>
            <h2 id="reportDetailTitle">Informe</h2>
            <p id="reportDetailSubtitle" class="subhead"></p>
          </div>
          <button id="backFromReportBtn" class="btn" type="button">Volver</button>
        </div>

        <div class="button-row report-actions">
          <button id="saveReportDetailBtn" class="btn pink" type="button">Grabar</button>
          <button id="viewReportDetailBtn" class="btn violet" type="button">Ver conjunto</button>
          <button id="downloadReportDetailPdfBtn" class="btn green" type="button">Descargar PDF</button>
          <button id="downloadReportDetailWordBtn" class="btn blue" type="button">Descargar Word</button>
        </div>

        <h2>Sistemas</h2>
        <div class="field">
          <label for="reportNotes">Datos del informe</label>
          <textarea id="reportNotes" class="report-notes" placeholder="Escribe aqui todos los datos que necesites guardar dentro de este informe"></textarea>
        </div>

        <div id="reportSystemButtons" class="systems"></div>

        <div id="reportPreparedEntries" class="prepared-list"></div>
        <div id="reportStatus" class="status" aria-live="polite"></div>

        <button id="deleteReportDetailBtn" class="btn delete-report-wide" type="button">ELIMINAR INFORME</button>
      </div>
    </section>

    <section id="systemScreen" class="screen" aria-labelledby="systemTitle">
      <div class="panel">
        <div class="toolbar">
          <div>
            <h2 id="systemTitle"></h2>
            <p id="systemSubtitle" class="subhead"></p>
          </div>
          <button id="backFromSystemBtn" class="btn" type="button">Volver</button>
        </div>

        <h2>Datos del cuadro resumen</h2>
        <div class="meta-grid">
          <div class="field">
            <label for="metaClient">Cliente</label>
            <input id="metaClient" type="text" placeholder="Cliente">
          </div>
          <div class="field">
            <label for="metaBuilding">Edificio</label>
            <input id="metaBuilding" type="text" placeholder="Edificio">
          </div>
          <div class="field">
            <label for="metaSystem">Sistema</label>
            <input id="metaSystem" type="text" placeholder="Sistema">
          </div>
          <div class="field">
            <label for="metaDenomination">Denominación</label>
            <input id="metaDenomination" type="text" placeholder="Denominación">
          </div>
        </div>

        <div id="sectionContainer"></div>

        <div class="section-block">
          <div class="section-head">
            <div class="section-title">Modo seguro ChatGPT</div>
            <div class="button-row">
              <button id="prepareChatGptBtn" class="btn violet" type="button">Preparar texto para ChatGPT</button>
              <button id="copyChatGptPromptBtn" class="btn blue" type="button">Copiar</button>
            </div>
          </div>
          <div class="two-fields">
            <div>
              <label for="chatGptPrompt">Texto del punto 3 Estado para copiar en ChatGPT</label>
              <textarea id="chatGptPrompt" readonly placeholder="Pulsa Preparar texto para ChatGPT"></textarea>
            </div>
            <div>
              <label for="chatGptResult">Respuesta mejorada de ChatGPT para 3 Estado</label>
              <textarea id="chatGptResult" placeholder="Pega aqui solo el texto mejorado del punto 3 Estado"></textarea>
            </div>
          </div>
          <div class="button-row" style="margin-top: 10px;">
            <button id="applyChatGptResultBtn" class="btn pink" type="button">Aplicar texto al informe</button>
          </div>
        </div>

        <h2>Imágenes</h2>
        <div id="photoContainer" class="photos"></div>

        <div class="button-row" style="margin-top: 18px;">
          <button id="saveEntryBtn" class="btn green" type="button">Grabar</button>
          <button id="viewEntryBtn" class="btn violet" type="button">Ver</button>
        </div>
        <div id="systemStatus" class="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="previewScreen" class="screen" aria-labelledby="previewTitle">
      <div class="panel">
        <div class="toolbar">
          <div>
            <h2 id="previewTitle">Vista previa</h2>
            <p id="previewSubtitle" class="subhead"></p>
          </div>
          <div class="button-row">
            <button id="backFromPreviewBtn" class="btn" type="button">Volver</button>

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(null);
      request.onblocked = () => resolve(null);
    });

    function loadState() {

    function normalizeLoadedState(state) {

      state.fixedTexts = mergeDefaultFixedTexts(state.fixedTexts || {});
      state.listing = normalizeListing(state.listing);
      state.savedReports = Array.isArray(state.savedReports) ? state.savedReports : [];
      state.savedReports.forEach(report => {
        report.notes = report.notes || "";
      });
      return state;
    }

    function normalizeListing(listing) {
      const data = listing && typeof listing === "object" ? listing : {};
      return {
        fileName: data.fileName || "",
        fileData: data.fileData || "",
        rows: Array.isArray(data.rows) ? data.rows.map(normalizeListingRow) : []
      };
    }

    function normalizeListingRow(row) {
      return {
        id: row.id || makeId(),
        num: String(row.num || ""),
        edificio: String(row.edificio || ""),
        planta: String(row.planta || ""),
        sistema: String(row.sistema || ""),
        marca: String(row.marca || ""),
        visto: Boolean(row.visto)
      };
    }

    function mergeDefaultFixedTexts(fixedTexts) {
      const merged = cloneData(DEFAULT_FIXED_TEXTS);
      Object.entries(fixedTexts || {}).forEach(([system, sections]) => {
        if (!merged[system]) merged[system] = {};
        Object.entries(sections || {}).forEach(([section, text]) => {
          if (text) merged[system][section] = text;
        });
      });
      return merged;
    }

    function saveState() {
      saveStateToDb(appState);
      return saveStateToLocalStorage();
    }

    function saveStateToLocalStorage() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(makeLocalStorageState(appState)));
        return true;
      } catch (error) {
        const target = els.systemScreen.classList.contains("active")
          ? els.systemStatus
          : els.previewScreen.classList.contains("active")
            ? els.previewStatus
            : els.homeStatus;
        setStatus(target, "No se pudo guardar. Reduce el tamaño o número de fotos.", true);
        return false;
      }
    }

    function makeLocalStorageState(state) {
      const copy = cloneData(state);
      stripHeavyReportData(copy);
      return copy;
    }

    function stripHeavyReportData(state) {
      if (state.listing) state.listing.fileData = "";
      (state.current?.entries || []).forEach(entry => stripHeavyEntryData(entry));
      (state.savedReports || []).forEach(report => {
        (report.sourceEntries || []).forEach(entry => stripHeavyEntryData(entry));
        (report.systems || []).forEach(system => {
          system.photos = [];
          system.html = "";
        });
      });
    }

    function stripHeavyEntryData(entry) {
      entry.photos = (entry.photos || []).map(() => null);
      entry.mountedHtml = "";
    }

    async function saveStateToDb(state) {
      const db = await dbPromise;
      if (!db) return false;
      return await new Promise(resolve => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(cloneData(state), STORAGE_KEY);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    }

    async function loadStateFromDb() {
      const db = await dbPromise;
      if (!db) return null;
      return await new Promise(resolve => {
        const tx = db.transaction(DB_STORE, "readonly");
        const request = tx.objectStore(DB_STORE).get(STORAGE_KEY);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      });
    }

    async function clearStateFromDb() {
      const db = await dbPromise;
      if (!db) return;
      await new Promise(resolve => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(STORAGE_KEY);
        tx.oncomplete = resolve;
        tx.onerror = resolve;
      });
    }

    async function restoreStateFromDb() {
      const stored = await loadStateFromDb();
      if (!stored) return;
      const localSavedCount = Array.isArray(appState.savedReports) ? appState.savedReports.length : 0;
      const dbSavedCount = Array.isArray(stored.savedReports) ? stored.savedReports.length : 0;
      const localPhotoCount = countPhotos(appState);
      const dbPhotoCount = countPhotos(stored);
      const localListingCount = countListing(appState);
      const dbListingCount = countListing(stored);
      if (dbSavedCount > localSavedCount || dbPhotoCount > localPhotoCount || dbListingCount > localListingCount) {
        appState = stored;
        normalizeLoadedState(appState);
        renderHome();
        setStatus(els.homeStatus, "Datos restaurados.");
      }
    }

    function countPhotos(state) {
      const currentPhotos = (state.current?.entries || []).reduce((count, entry) => count + (entry.photos || []).filter(Boolean).length, 0);
      const savedPhotos = (state.savedReports || []).reduce((count, report) => {
        const fromEntries = (report.sourceEntries || []).reduce((subtotal, entry) => subtotal + (entry.photos || []).filter(Boolean).length, 0);
        const fromSystems = (report.systems || []).reduce((subtotal, system) => subtotal + (system.photos || []).filter(Boolean).length, 0);
        return count + fromEntries + fromSystems;
      }, 0);
      return currentPhotos + savedPhotos;
    }

    function countListing(state) {
      const listing = state.listing || {};
      return (listing.rows || []).length + (listing.fileData ? 1 : 0);
    }

    function setStatus(el, message, isError = false) {

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function chunkArray(items, size) {
      const chunks = [];
      for (let index = 0; index < items.length; index += size) {
        chunks.push(items.slice(index, index + size));
      }
      return chunks;
    }

    async function loadListingExcel(event) {

      if (!file) return;
      try {

          file.arrayBuffer(),
          fileToDataUrl(file)
        ]);
        const rows = parseListingWorkbook(arrayBuffer);
        appState.listing = {
          fileName: file.name,
          fileData,
          rows
        };
        saveState();
        renderListing();
        setStatus(els.listingStatus, `${rows.length} registro(s) cargado(s).`);
      } catch (error) {
        setStatus(els.listingStatus, "No se pudo leer el Excel. Revisa que sea .xlsx, .xls o .csv.", true);
      } finally {
        event.target.value = "";
      }
    }

    function parseListingWorkbook(arrayBuffer) {
      if (!window.XLSX) throw new Error("XLSX no disponible");
      const workbook = XLSX.read(arrayBuffer, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      if (!firstSheetName) return [];
      const sheet = workbook.Sheets[firstSheetName];
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      if (!matrix.length) return [];
      const headers = matrix[0].map(normalizeListingHeader);
      const hasHeaders = LISTING_COLUMNS.some(column => headers.includes(column));
      const rows = hasHeaders ? matrix.slice(1) : matrix;
      return rows
        .filter(row => row.some(cell => String(cell || "").trim()))
        .map((row, rowIndex) => {
          const oldFourColumnFormat = !hasHeaders && row.length <= 4;
          const getCell = (column, fallbackIndex) => {
            if (hasHeaders) {
              const headerIndex = headers.indexOf(column);
              return headerIndex >= 0 ? row[headerIndex] : "";
            }
            return row[fallbackIndex] || "";
          };
          return normalizeListingRow({
            num: String(rowIndex + 1),
            edificio: getCell("edificio", oldFourColumnFormat ? 0 : 1),
            planta: getCell("planta", oldFourColumnFormat ? 1 : 2),
            sistema: getCell("sistema", oldFourColumnFormat ? 2 : 3),
            marca: getCell("marca", oldFourColumnFormat ? 3 : 4),
            visto: false
          });
        });
    }

    function normalizeListingHeader(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()

        return;
      }
      if (!window.XLSX || !listing.rows.length) {
        downloadDataUrlFile(listing.fileData, listing.fileName || "listado.xlsx");
        return;
      }
      const rows = listing.rows.map(row => ({
        Num: row.num,
        Visto: row.visto ? "SI" : "",
        Edificio: row.edificio,
        Planta: row.planta,
        Sistema: row.sistema,
        Marca: row.marca
      }));
      const workbook = XLSX.utils.book_new();
      const sheet = XLSX.utils.json_to_sheet(rows, { header: ["Num", "Visto", "Edificio", "Planta", "Sistema", "Marca"] });
      XLSX.utils.book_append_sheet(workbook, sheet, "LISTADO");
      const bytes = XLSX.write(workbook, { bookType: "xlsx", type: "array" });
      const fileName = (listing.fileName || "listado.xlsx").replace(/\.(xlsx|xls|csv)$/i, "") + "-listado.xlsx";
      downloadBlob(bytes, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", fileName);
    }

    function startDictation(section) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const target = document.querySelector(`[data-voice="${CSS.escape(section)}"]`);

      if (!SpeechRecognition || !target) {
        setStatus(els.systemStatus, "El dictado por voz no está disponible en este navegador.", true);
        return;
      }

      if (activeRecognition) activeRecognition.stop();
      const recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      recognition.continuous = false;
      recognition.interimResults = false;
      activeRecognition = recognition;

      recognition.onstart = () => setStatus(els.systemStatus, `Escuchando: ${section}`);
      recognition.onerror = () => setStatus(els.systemStatus, "No se pudo completar el dictado.", true);
      recognition.onresult = event => {
        const transcript = Array.from(event.results)
          .map(result => result[0].transcript)
          .join(" ")
          .trim();
        target.value = [target.value.trim(), transcript].filter(Boolean).join("\n");
        saveSystemInputs();
        setStatus(els.systemStatus, "Texto dictado añadido.");
      };
      recognition.onend = () => { activeRecognition = null; };
      recognition.start();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function compressImageFile(file, maxSide = 1280, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const width = Math.max(1, Math.round(img.width * scale));
          const height = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("No se pudo leer la imagen."));
        };
        img.src = url;
      });
    }

    function buildSystemReport(entryId) {
      saveSystemInputs();
      const data = ensureEntry(entryId);
      const report = composeEntryReport(data);

      data.mountedHtml = report.html;
      data.mountedText = report.text;
      saveState();
      return report;
    }

    function composeEntryReport(data) {
      const sectionHtml = SECTIONS.map(section => {
        const item = data.sections?.[section] || emptySection();
        const fixed = item.fixed.trim();
        const voice = item.voice.trim();
        const paragraph = composeParagraph(section, fixed, voice);
        return `<div class="doc-section"><h3>${escapeHtml(section)}</h3><p>${escapeHtml(paragraph)}</p></div>`;
      }).join("");

      const photos = (data.photos || []).filter(Boolean);
      const photoHtml = photos.length
        ? `<div class="photo-title">ANEXO FOTOGRÁFICO</div>${chunkArray(photos, 4).map(group => `<div class="photo-page"><div class="photo-grid">${group.map(src => `<div class="photo-card"><img src="${src}" alt=""></div>`).join("")}</div></div>`).join("")}`
        : `<div class="photo-title">ANEXO FOTOGRÁFICO</div>`;
      const systemHeading = buildSystemHeading(data);

      const html = `
        <section class="doc-part">
          <div class="doc-system-title">${systemHeading}</div>
          ${sectionHtml}
          ${photoHtml}
        </section>
      `;

      const text = [
        data.type,
        ...SECTIONS.flatMap(section => {
          const item = data.sections?.[section] || emptySection();
          return [
            section,
            composeParagraph(section, item.fixed.trim(), item.voice.trim())
          ];
        }),
        "ANEXO FOTOGRÁFICO"
      ].join("\n\n");

      return { html, text };
    }

    function buildSystemHeading(data) {
      const client = (data.meta?.client || "").trim();
      const building = (data.meta?.building || "").trim();
      const system = (data.meta?.system || data.type || "").trim();
      return [client, building, system]
        .map(value => escapeHtml(value.toUpperCase()))
        .join("<br>");
    }

    function formatChatGptReportHtml(text) {
      return text
        .split(/\n{2,}/)
        .map(block => block.trim())
        .filter(Boolean)
        .map(block => {
          const safe = escapeHtml(block).replace(/\n/g, "<br>");
          if (/^(\d+\.\s|[A-ZÁÉÍÓÚÑ0-9\s.,-]{8,})$/.test(block.trim())) {
            return `<h3>${safe}</h3>`;
          }
          return `<p>${safe}</p>`;
        })
        .join("");
    }

    function buildReportCover(report) {
      const header = (report.header || "INFORME").toUpperCase();
      const revisionNumber = (report.revisionNumber || "1 RT-2026").toUpperCase();
      const revisionText = (report.revisionText || "TRIMESTRAL").toUpperCase();
      const notes = (report.notes || "").trim();
      const rows = report.systems.map(system => `
        <tr>
          <td>${escapeHtml(system.meta?.building || "")}</td>
          <td>${escapeHtml(system.meta?.system || system.name)}</td>
          <td>${escapeHtml(system.meta?.denomination || system.name)}</td>
        </tr>
      `).join("");

      return `
        <div class="doc-main-title">${escapeHtml(header)}</div>
        <div class="doc-revision-row">
          <div><strong>Nº REVISIÓN:</strong> ${escapeHtml(revisionNumber)}</div>
          <div><strong>REVISIÓN:</strong> ${escapeHtml(revisionText)}</div>
        </div>
        <table class="summary-table">
          <tr><th class="summary-client" colspan="3">CLIENTE: <span>${escapeHtml(report.systems[0]?.meta?.client || header)}</span></th></tr>
          <tr>
            <th class="summary-head">EDIFICIO</th>
            <th class="summary-head">SISTEMA</th>
            <th class="summary-head">DENOMINACIÓN</th>
          </tr>
          ${rows || '<tr><td></td><td></td><td></td></tr>'}
        </table>
        ${notes ? `<div class="doc-section"><h3>Datos del informe</h3><p>${escapeHtml(notes)}</p></div>` : ""}
      `;
    }

    function composeParagraph(section, fixed, voice) {
      const content = [fixed, voice].filter(Boolean).join(" ");
      if (!content) return "No se han indicado datos para este apartado.";

      if (section.includes("Antecedentes")) {
        return `Se toma como antecedente la información aportada para el sistema, dejando constancia de las condiciones observadas y de los datos relevantes para valorar la instalación. ${content}`;
      }
      if (section.includes("Comprobaciones")) {
        return `Se realizan comprobaciones visuales y funcionales sobre los elementos descritos, atendiendo a su estado, accesibilidad, señalización, alimentación, supervisión y respuesta prevista. ${content}`;
      }
      if (section.includes("Estado")) {
        return `El estado del sistema se valora conforme a las observaciones registradas, diferenciando los elementos operativos de aquellos que requieren revisión, reparación o sustitución. ${content}`;
      }
      if (section.includes("Normativa")) {
        return `La valoración se relaciona con la normativa de protección contra incendios aplicable, el RIPCI y las normas UNE que correspondan al sistema inspeccionado. ${content}`;
      }
      return `Como conclusión técnica, se recoge la actuación o seguimiento necesario para dejar el sistema en condiciones adecuadas de servicio y mantenimiento. ${content}`;
    }

    function buildChatGptPrompt(data) {
      const stateSection = SECTIONS[2];
      const item = data.sections?.[stateSection] || emptySection();

      return `Quiero que redactes solo el texto del apartado 3. Estado de un informe tecnico de sistemas PCI.

Sistema: ${data.type}
Cliente: ${data.meta?.client || appState.current.header || ""}
Edificio: ${data.meta?.building || ""}
Sistema indicado: ${data.meta?.system || data.type}
Denominacion: ${data.meta?.denomination || data.type}

Criterio de redaccion:
- Usa estilo tecnico, claro, directo y profesional.
- No inventes datos que no aparezcan en la informacion aportada.
- Desarrolla el texto de forma logica, como en informes anteriores de mantenimiento PCI.
- Redacta solamente el contenido del punto 3. Estado.
- No escribas el titulo "3. Estado"; devuelve solo el texto que ira dentro del apartado.
- Aprovecha el texto fijo como contexto, pero mejora solo el texto aportado/redactado por el usuario.
- Si falta algun dato, no lo rellenes inventando; redacta de forma prudente.
- No incluyas explicaciones sobre lo que has hecho.

Datos disponibles:

Texto fijo del punto 3. Estado:
${item.fixed.trim() || "Sin texto fijo."}

Texto aportado/redactado por el usuario en 3. Estado:
${item.voice.trim() || "Sin texto aportado."}`;
    }

    async function saveCurrentReport() {
      saveSystemInputs();
      const systems = collectCurrentSystems();

      if (!systems.length && !appState.current.header.trim()) {
        setStatus(els.homeStatus, "No hay datos para grabar.", true);
        return;
      }

      const existingIndex = appState.savedReports.findIndex(report =>
        appState.current.editingId && report.id === appState.current.editingId
      );
      const report = {
        id: existingIndex >= 0 ? appState.savedReports[existingIndex].id : makeId(),
        number: appState.current.number,
        header: appState.current.header,
        revisionNumber: appState.current.revisionNumber,
        revisionText: appState.current.revisionText,
        notes: appState.current.notes || "",
        systems,
        sourceSystems: cloneData(appState.current.systems),
        sourceEntries: cloneData(appState.current.entries),
        createdAt: new Date().toISOString()
      };
      const previousCurrent = cloneData(appState.current);
      const previousReports = cloneData(appState.savedReports);
      const previousNextNumber = appState.nextNumber;

      if (existingIndex >= 0) appState.savedReports[existingIndex] = report;
      else appState.savedReports.push(report);

      normalizeSavedReports();
      appState.nextNumber = getNextReportNumber();
      appState.current = {
        number: appState.nextNumber,
        header: "",
        revisionNumber: "1 RT-2026",
        revisionText: "TRIMESTRAL",
        systems: {},
        entries: [],
        notes: "",
        editingId: null
      };
      const dbOk = await saveStateToDb(appState);
      const localOk = saveStateToLocalStorage();
      const needsPhotoStorage = reportHasPhotos(report);
      if ((needsPhotoStorage && !dbOk) || (!needsPhotoStorage && !dbOk && !localOk)) {
        appState.current = previousCurrent;
        appState.savedReports = previousReports;
        appState.nextNumber = previousNextNumber;
        renderHome();
        setStatus(els.homeStatus, "No se pudo grabar el informe con las fotos. Reduce el tamaño o número de fotos.", true);
        showScreen("newReportScreen");
        return;
      }
      renderHome();
      setStatus(els.homeStatus, `Informe ${report.number} grabado.`);
      showScreen("homeScreen");
    }

        .filter(item => item.data.mountedHtml || hasSystemContent(item.data))
        .map(item => {

    function hasSystemContent(data) {
      return SECTIONS.some(section => {
        const item = data.sections[section] || emptySection();
        return item.fixed.trim() || item.voice.trim();
      }) || data.photos.some(Boolean);
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return `report-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function normalizeSavedReports() {
      const byId = new Map();
      appState.savedReports.forEach(report => {
        if (!report.id) report.id = makeId();
        report.number = Number(report.number || 0);
        report.systems = Array.isArray(report.systems) ? report.systems : [];
        report.notes = report.notes || "";
        byId.set(report.id, report);
      });
      appState.savedReports = [...byId.values()]
        .filter(report => report.number > 0)
        .sort((a, b) => a.number - b.number);
    }

    function getNextReportNumber() {
      normalizeSavedReports();
      const maxSaved = appState.savedReports.reduce((max, report) => Math.max(max, Number(report.number || 0)), 0);
      return maxSaved + 1;
    }

    function cloneData(value) {
      return JSON.parse(JSON.stringify(value || {}));
    }

    function systemsFromSavedReport(report) {
      if (report.sourceSystems) return cloneData(report.sourceSystems);

      const systems = {};
      (report.systems || []).forEach(item => {
        const sections = {};
        SECTIONS.forEach(section => {
          sections[section] = emptySection();
        });
        sections[SECTIONS[0]].voice = item.text || "";
        systems[item.name] = {
          sections,
          photos: item.photos || [],
          mountedHtml: item.html || "",
          mountedText: item.text || ""
        };
      });
      return systems;
    }

    function entriesFromSavedReport(report) {
      if (report.sourceEntries) return cloneData(report.sourceEntries);
      if (report.sourceSystems) return entriesFromSystems(report.sourceSystems);

      return (report.systems || []).map(item => ({
        id: makeId(),
        type: item.name,
        meta: item.meta || {
          client: report.header || "",
          building: "",
          system: item.name,
          denomination: item.name
        },
        sections: { [SECTIONS[0]]: { fixed: "", voice: item.text || "" } },
        photos: item.photos || [],
        chatGptPrompt: "",
        chatGptResult: "",
        mountedHtml: item.html || "",
        mountedText: item.text || ""
      }));
    }

      const entries = entriesFromSavedReport(report);

        revisionNumber: report.revisionNumber || "1 RT-2026",

      const systems = systemsForOutput(report);
      const header = [

    function systemsForOutput(report) {

            text: built.text,
            photos: (entry.photos || []).filter(Boolean)

    function downloadPdfFromText(text, filename) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const margin = 42;
      const maxWidth = 511;
      const lines = doc.splitTextToSize(text, maxWidth);
      let y = margin;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10.5);
      lines.forEach(line => {
        if (y > 800) {
          doc.addPage();
          y = margin;
        }
        doc.text(line, margin, y);
        y += 14;
      });
      doc.save(filename);
    }

    async function downloadPdfFromHtml(html, filename) {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "pt", format: "a4" });
      const pageState = { count: 0 };
      const renderHost = document.createElement("div");
      renderHost.style.position = "absolute";
      renderHost.style.left = "0";
      renderHost.style.top = "0";
      renderHost.style.width = "794px";
      renderHost.style.background = "#ffffff";
      renderHost.style.padding = "32px";
      renderHost.style.boxSizing = "border-box";
      renderHost.style.pointerEvents = "none";
      renderHost.style.zIndex = "-1";
      document.body.appendChild(renderHost);

      try {
        const units = createPdfRenderUnits(html);
        for (const unit of units) {
          if (unit.type === "blank") {
            addBlankPdfPage(pdf, pageState);
            continue;
          }
          renderHost.innerHTML = "";
          renderHost.appendChild(unit.element);
          await waitForImages(renderHost);
          await addElementToPdf(pdf, renderHost, pageState);
        }
        if (!pageState.count) addBlankPdfPage(pdf, pageState);
        pdf.save(filename);
      } finally {
        renderHost.remove();
      }
    }

    function createPdfRenderUnits(html) {
      const template = document.createElement("template");
      template.innerHTML = html.trim();
      const source = template.content.querySelector(".doc") || template.content;
      const children = Array.from(source.children);
      if (!children.length) return [makePdfContentUnit(Array.from(template.content.childNodes).map(node => node.cloneNode(true)))];

      const units = [];
      let coverNodes = [];
      const flushCover = () => {
        if (!coverNodes.length) return;
        units.push(makePdfContentUnit(coverNodes));
        coverNodes = [];
      };

      children.forEach(child => {
        if (child.classList.contains("blank-page")) {
          flushCover();
          units.push({ type: "blank" });
          return;
        }
        if (child.classList.contains("doc-part")) {
          flushCover();
          units.push(makePdfContentUnit([child.cloneNode(true)]));
          return;
        }
        coverNodes.push(child.cloneNode(true));
      });
      flushCover();
      return units;
    }

    function makePdfContentUnit(nodes) {
      const wrapper = document.createElement("div");
      wrapper.className = "doc";
      nodes.forEach(node => wrapper.appendChild(node));
      return { type: "content", element: wrapper };
    }

    function waitForImages(root) {
      const images = Array.from(root.querySelectorAll("img"));
      return Promise.all(images.map(image => {
        if (image.complete) return Promise.resolve();
        return new Promise(resolve => {
          image.onload = resolve;
          image.onerror = resolve;
        });
      }));
    }

    async function addElementToPdf(pdf, element, pageState) {
      const canvas = await html2canvas(element, {
        scale: 1.6,
        backgroundColor: "#ffffff",
        useCORS: true,
        windowWidth: 794
      });
      if (!canvas.width || !canvas.height) return;

      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 28;
      const imgWidth = pageWidth - margin * 2;
      const pageCanvas = document.createElement("canvas");
      const pageCtx = pageCanvas.getContext("2d");
      const sourcePageHeight = Math.floor((pageHeight - margin * 2) * canvas.width / imgWidth);
      const protectedBlocks = getPdfProtectedBlocks(element, canvas);
      pageCanvas.width = canvas.width;

      let sourceY = 0;
      while (sourceY < canvas.height) {
        const sliceSourceHeight = getSafePdfSliceHeight(sourceY, sourcePageHeight, canvas.height, protectedBlocks);
        pageCanvas.height = sliceSourceHeight;
        pageCtx.clearRect(0, 0, pageCanvas.width, pageCanvas.height);
        pageCtx.fillStyle = "#ffffff";
        pageCtx.fillRect(0, 0, pageCanvas.width, sliceSourceHeight);
        pageCtx.drawImage(
          canvas,
          0,
          sourceY,
          canvas.width,
          sliceSourceHeight,
          0,
          0,
          canvas.width,
          sliceSourceHeight
        );
        if (pageState.count > 0) pdf.addPage();
        const pageData = pageCanvas.toDataURL("image/jpeg", 0.92);
        const sliceHeight = sliceSourceHeight * imgWidth / canvas.width;
        pdf.addImage(pageData, "JPEG", margin, margin, imgWidth, sliceHeight);
        pageState.count += 1;
        sourceY += sliceSourceHeight;
      }
    }

    function addBlankPdfPage(pdf, pageState) {
      if (pageState.count > 0) pdf.addPage();
      pdf.setFillColor(255, 255, 255);
      pdf.rect(0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight(), "F");
      pageState.count += 1;
    }

    function getPdfProtectedBlocks(host, canvas) {
      const hostRect = host.getBoundingClientRect();
      const scale = canvas.width / hostRect.width;
      return Array.from(host.querySelectorAll(".doc-section, .photo-card, .photo-page, .summary-table, .doc-revision-row, .doc-system-title"))
        .map(element => {
          const rect = element.getBoundingClientRect();
          return {
            top: Math.max(0, Math.floor((rect.top - hostRect.top) * scale)),
            bottom: Math.max(0, Math.ceil((rect.bottom - hostRect.top) * scale))
          };
        })
        .filter(block => block.bottom > block.top + 8)
        .sort((a, b) => a.top - b.top);
    }

    function getSafePdfSliceHeight(sourceY, preferredHeight, totalHeight, blocks) {
      const remaining = totalHeight - sourceY;
      if (remaining <= preferredHeight) return remaining;

      const desiredCut = sourceY + preferredHeight;
      const minSlice = Math.floor(preferredHeight * 0.35);
      const gap = 10;
      const crossingBlock = blocks.find(block =>
        block.top > sourceY + minSlice &&
        block.top < desiredCut - gap &&
        block.bottom > desiredCut
      );

      if (crossingBlock) return Math.max(minSlice, crossingBlock.top - sourceY - gap);
      return preferredHeight;
    }

    function downloadBlob(bytes, type, filename) {
      const blob = new Blob([bytes], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function downloadDataUrlFile(dataUrl, filename) {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

        renderEntry(entry.id);
      }

      const editButton = event.target.closest("[data-edit-entry]");
      if (editButton) {
        systemReturnScreen = "newReport";
        renderEntry(editButton.dataset.editEntry);
        return;
      }

      const removeButton = event.target.closest("[data-remove-entry]");
      if (removeButton) {
        appState.current.entries = appState.current.entries.filter(entry => entry.id !== removeButton.dataset.removeEntry);
        saveState();
        renderHome();
      }
    });

    els.reportPreparedEntries.addEventListener("click", event => {
      const editButton = event.target.closest("[data-edit-entry]");
      if (editButton) {
        systemReturnScreen = "report";
        renderEntry(editButton.dataset.editEntry);
        return;
      }

      const removeButton = event.target.closest("[data-remove-entry]");
      if (removeButton) {
        appState.current.entries = appState.current.entries.filter(entry => entry.id !== removeButton.dataset.removeEntry);
        saveState();
        renderReportScreen();
      }
    });

    [els.metaClient, els.metaBuilding, els.metaSystem, els.metaDenomination].forEach(input => {
      input.addEventListener("input", saveSystemInputs);
    });
    els.chatGptResult.addEventListener("input", saveSystemInputs);

    els.savedReports.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const report = getReport(button.dataset.id);
      if (!report) return;

      if (button.dataset.action === "delete") {
        appState.savedReports = appState.savedReports.filter(item => item.id !== report.id);
        if (appState.current.editingId === report.id) {
          appState.current = {
            number: appState.nextNumber || 1,
            header: "",
            revisionNumber: "1 RT-2026",
            revisionText: "TRIMESTRAL",
            systems: {},
            entries: [],
            notes: "",
            editingId: null
          };
        }
        saveState();
        renderHome();
        setStatus(els.homeStatus, `Informe ${report.number} borrado.`);
      }
      if (button.dataset.action === "open") {
        openSavedReport(report);
      }
      if (button.dataset.action === "word") {
        downloadWord(buildFullHtml(report), `informe-${report.number}.doc`);
      }
      if (button.dataset.action === "pdf") {
        downloadPdfFromHtml(buildFullHtml(report), `informe-${report.number}.pdf`);
      }
    });

    els.savedReports.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      if (event.target.closest("button")) return;
      const reportCard = event.target.closest('[data-action="open"]');
      if (!reportCard) return;
      event.preventDefault();
      const report = getReport(reportCard.dataset.id);
      if (report) openSavedReport(report);
    });

    els.sectionContainer.addEventListener("input", saveSystemInputs);
    els.sectionContainer.addEventListener("click", event => {
      const button = event.target.closest("[data-dictate]");
      if (button) startDictation(button.dataset.dictate);
    });

    els.photoContainer.addEventListener("change", async event => {
      const input = event.target.closest("[data-photo]");
      if (!input || !input.files[0]) return;
      const data = ensureEntry(activeEntryId);
      const index = Number(input.dataset.photo);
      try {
        const previous = data.photos[index];
        data.photos[index] = await compressImageFile(input.files[0]);
        data.mountedHtml = "";
        data.mountedText = "";
        if (!saveState()) {
          data.photos[index] = previous;
          return;
        }
        renderEntry(activeEntryId, { keepScroll: true });
        els.photoContainer.scrollIntoView({ block: "start" });
      } catch (error) {
        setStatus(els.systemStatus, "No se pudo cargar la imagen.", true);
      }
    });

    els.photoContainer.addEventListener("click", event => {
      const button = event.target.closest("[data-delete-photo]");
      if (!button) return;
      const data = ensureEntry(activeEntryId);
      data.photos[Number(button.dataset.deletePhoto)] = null;
      data.mountedHtml = "";
      data.mountedText = "";
      saveState();
      renderEntry(activeEntryId);
    });

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      els.installAppBtn.hidden = false;
    });

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      els.installAppBtn.hidden = true;
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js?v=17", { updateViaCache: "none" })
          .then(registration => registration.update())
          .catch(() => {});
      });
    }

    renderHome();
    restoreStateFromDb();
  </script>
